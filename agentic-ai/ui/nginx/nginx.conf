events {}
http {
  server {
    listen 80;

    # React app (catch-all — must come last in specificity)
    location / {
      proxy_pass         http://react-app:3000;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # Grafana — DISABLED: grafana now lives in the digital-twin stack's own
    # docker-compose (separate project/network), so this hostname does not
    # resolve here. nginx fails to start with a dangling static proxy_pass
    # target, so the block is commented out rather than left dangling.
    # Re-enable once the two stacks are networked together.
    # location /grafana/ {
    #   proxy_pass         http://grafana:3000/;
    #   proxy_set_header   Host $host;
    # }

    # API Gateway (generic /api/ catch — overridden by more-specific prefixes below)
    location /api/ {
      proxy_pass         http://api-gateway:8000/;
      proxy_set_header   Host $host;
    }

    # Digital Twin — DISABLED: same reason as /grafana/ above, digital-twin
    # is not on this docker network. Re-enable once connected.
    # location /api/twin/ {
    #   proxy_pass         http://digital-twin:8001/;
    #   proxy_set_header   Host $host;
    #   proxy_read_timeout 120s;
    # }

    # Actuator — /api/act/* → actuator:8003/*
    location /api/act/ {
      proxy_pass         http://actuator:8003/;
      proxy_set_header   Host $host;
      proxy_read_timeout 120s;
    }

    # AI Agent — /api/agent/* → ai-agent:8003/* (internal port)
    location /api/agent/ {
      proxy_pass         http://ai-agent:8003/;
      proxy_set_header   Host $host;
      proxy_read_timeout 300s;
    }
  }
}
