# Maps a present Upgrade header to "upgrade" and an absent one to "close" —
# what proxy_pass needs to hand a WebSocket through. conf.d/*.conf is included
# inside nginx's http block, so this map is at the right scope.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: every unknown path resolves to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Digital twin REST + the telemetry WebSocket. The Upgrade headers are what
    # make /api/twin/ws/telemetry work through the proxy.
    location /api/twin/ {
        proxy_pass http://digital-twin:8001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Grafana's JSON API, same-origin, so the Analytics page can read the
    # dashboard's panel list. Grafana sends no CORS headers, so a direct
    # cross-origin fetch from :8080 to :3001 is blocked by the browser.
    # The iframes still load from Grafana's own origin — only this fetch is
    # proxied, which avoids having to move Grafana onto a sub-path.
    # proxy_pass via a variable plus resolver so nginx still starts when
    # Grafana is down, instead of failing on an unresolvable upstream.
    location /grafana/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $grafana_upstream http://grafana:3000;
        rewrite ^/grafana/(.*)$ /$1 break;
        proxy_pass $grafana_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
